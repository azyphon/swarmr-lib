[project]
name = "swarmr"
version = "1.0.1"
description = "Deep Agents teams of domain specialists, exposed over MCP and a terminal CLI."
requires-python = ">=3.13"
# Core only: the shared machinery, the CLI and the MCP server. Teams live in
# their own distributions and depend on this one; nothing here depends on a
# team, so installing core drags in no team's SDK and no team is discoverable
# except through installed metadata.
dependencies = [
  # Capped: deepagents ships breaking changes in minor releases, and the
  # SubAgent/create_deep_agent surface this package builds on is exactly what
  # moves. Raise the ceiling deliberately, with the test suite as the gate.
  "deepagents>=0.7.9,<0.8",
  "langchain-openai>=1.6",
  "mcp>=2",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1"]

# Teams advertise themselves in the `swarmr.teams` entry-point group; the
# registry reads that group and nothing else. Core ships no team of its own, so
# there is deliberately no entry-point table here.

[project.scripts]
teams = "swarmr.cli:main"
teams-mcp = "swarmr.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmr"]
# Tests live beside the code they test; they are not part of the installed
# package.
exclude = ["**/tests"]

[tool.pyright]
# No venvPath/venv: those hardcode a `./.venv` that exists on a contributor's
# machine and nowhere else. CI installs into the interpreter already on PATH,
# and pinning a directory there made pyright find no interpreter at all and
# report every third-party import as unresolved. Pyright takes the interpreter
# from PATH, so activate the venv (or pass --pythonpath) when running locally.
pythonVersion = "3.13"
include = ["src", "tests", "conftest.py"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
# Slice tests live inside the package they cover (src/**/tests); only the tests
# of the composed whole live in tests/.
testpaths = ["src", "tests"]
# importlib import mode: test modules need no __init__.py and duplicate
# basenames across slices do not collide.
addopts = "-q --strict-markers --import-mode=importlib"
markers = ["e2e: needs a live cluster and a model API key"]

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
